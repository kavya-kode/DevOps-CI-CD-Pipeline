name: Build Pipeline

on:
  push:
    branches:
      - main
      - development

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r application_source/requirements.txt

      - name: Run Application
        run: |
          python application_source/app.py